# Copy to `ghostcompanion.yaml` (or point GHOSTCOMPANION_CONFIG at another path).

# Rename symbols before exporting to Ghostfolio: <source symbol>: <Ghostfolio symbol>.
symbol_mapping:
  EURN: CMBT

# Self-custody wallets, each tracked as its own Ghostfolio account.
wallets:
  - name: Cold Storage
    network: bitcoin
    # List every address the wallet uses, change addresses included.
    addresses:
      - bc1qexampleaddressaaaaaaaaaaaaaaaaaaaaaaaa
      - bc1qexampleaddressbbbbbbbbbbbbbbbbbbbbbbbb
  # An EVM wallet: one account for the same address on every network listed.
  - name: DeFi Wallet
    networks: [ethereum, base]
    addresses:
      - "0x1111111111111111111111111111111111111111"

# Tokens EVM wallets track besides USDC and ETH. A well-known one needs no
# contract; any other gives its network and contract (never its name: scams copy
# names). `price` is the Yahoo coin pricing moves that aren't swaps when DefiLlama
# has no price for the token at that moment.
tokens:
  cbBTC:
    symbol: CBBTC
    data_source: GHOSTFOLIO
    price: BTC
  ABTC:
    network: base
    contract: "0x3764f07752384450576c6d8b027d06ffa29e5ae9"
    data_source: GHOSTFOLIO
